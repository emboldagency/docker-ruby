name: Build and Deploy Ruby

on:
  push:
    branches:
      - main # keeps the registry cache warm
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      skip-jobs:
        description: "Space-separated jobs to skip: build-and-push-docker, update-coder-template"
        required: false
        default: ""

jobs:
  build:
    uses: emboldagency/.github/.github/workflows/docker-build.yml@master
    permissions:
      contents: read
      packages: write
    with:
      language: ruby
      versions: '["4.0.5", "3.4.9", "3.3.11", "3.3.1", "3.0.7"]'
      ubuntu_versions: '["24.04", "26.04"]'
      # Ruby 3.0.x predates Ubuntu 26.04's toolchain (GCC 15, OpenSSL 3.5),
      # and ruby-build doesn't auto-patch EOL'd Rubies for new compilers.
      exclude: '[{"version": "3.0.7", "ubuntu": "26.04"}]'
      latest_version: "4.0.5"
      latest_ubuntu: "26.04"
      coder_template: ruby
      skip_jobs: ${{ inputs.skip-jobs || '' }}
    secrets: inherit
